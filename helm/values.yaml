kraken:
  repository: gcr.io/uber-container-tools
  tag: v0.1.1
  imagePullPolicy: IfNotPresent
  registry_port: 30081

tracker:
  config: /etc/config/tracker.yaml
  replicas: 3
  hostNetwork: true
  tolerations:
    - key: "node.kubernetes.io/not-ready"
      operator: "Exists"
      effect: "NoExecute"
  extraVolumes:
