apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraken-build-index
spec:
  replicas: {{ .Values.build_index.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kraken
      app.kubernetes.io/component: build-index
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kraken
        app.kubernetes.io/component: build-index
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{ with .Values.build_index.annotations -}}
      annotations:
{{ tpl . $ | indent 8 }}
      {{- end }}
    spec:
      {{- if hasKey .Values.build_index "hostNetwork" }}
      hostNetwork: {{ .Values.build_index.hostNetwork }}
      {{- end }}
      {{ with .Values.build_index.tolerations -}}
      tolerations:
{{ toYaml . | indent 6 }}
      {{- end }}
      {{- if .Values.build_index.affinity }}
      {{ with .Values.build_index.affinity -}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
{{ toYaml . | indent 12 }}
      {{- end }}
      {{- end }}
      {{ with .Values.build_index.initContainers -}}
      initContainers:
{{ toYaml . | indent 6 }}{{ end }}
      containers:
      - name: main
        image: {{ .Values.kraken.repository }}/kraken-build-index:{{ .Values.kraken.tag }}
        imagePullPolicy: {{ .Values.kraken.imagePullPolicy }}
        command:
        - /bin/bash
        - -c
        - "sleep 30 && /usr/bin/kraken-build-index --config={{ .Values.build_index.config }} --port=80"
        volumeMounts:
        - name: config
          mountPath: /etc/config
{{ with .Values.build_index.extraVolumeMounts }}{{ toYaml . | indent 8 }}{{ end }}
      volumes:
      - name: config
        configMap:
          name: kraken
{{ with .Values.build_index.extraVolumes }}{{ toYaml . | indent 6 }}{{ end }}
---
kind: Service
apiVersion: v1
metadata:
  name: kraken-build-index
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kraken
    app.kubernetes.io/component: build-index
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: {{ .Values.kraken.build_index_port }}
